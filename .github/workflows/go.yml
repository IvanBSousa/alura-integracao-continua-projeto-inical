# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Integracao Continua

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Inicia banco
      run: |
        docker compose up -d postgres
        until docker compose exec -T postgres pg_isready -U postgres -d root; do
          echo "Aguardando PostgreSQL..."
          sleep 2
        done

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13
        args: controllers/ database/ models/ routes/

    - name: Test
      # env:
      #   DB_HOST: 127.0.0.1
      #   DB_PORT: "5432"
      #   DB_USER: postgres
      #   DB_PASSWORD: postgres
      #   DB_NAME: root
      run: DB_HOST=${{ secrets.DB_HOST }} DB_PORT=${{ secrets.DB_PORT }} DB_USER=${{ secrets.DB_USER }} DB_PASSWORD=${{ secrets.DB_PASSWORD }} DB_NAME=${{ secrets.DB_NAME }} go test -v main_test.go

    -name: Build
      run: go build -o main main.go

    -name: Projeto compilado
      uses: actions/upload-artifact@v7
      with:
        name: main
        path: main